# Configuration for qumo relay server

server:
  # Address to bind the relay server (QUIC/MOQT)
  address: "0.0.0.0:4433"
  
  # TLS certificate files
  cert_file: "certs/server.crt"
  key_file: "certs/server.key"

relay:
  # Number of group caches to keep in memory
  # Higher values use more memory but reduce cache misses
  # Default: 100
  group_cache_size: 100
  
  # Frame buffer size in bytes
  # Should match your typical media frame size (e.g., 1500 for network MTU)
  # Default: 1500
  frame_capacity: 1500

# Peer relays (optional)
# The relay will connect to each peer, discover announcements via
# ANNOUNCE_PLEASE (draft-03), and register them on the local TrackMux.
# Reconnects automatically on connection loss.
# peers:
#   - address: "moqt://relay-tokyo:4433"
#   - address: "moqt://relay-london:4433"

# RTMP ingest (optional)
# When configured, the relay also listens for RTMP publish connections
# and announces the ingested media as MoQT tracks.
# ingest:
#   rtmp_address: ":1935"
