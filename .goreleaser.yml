# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: qumo

before:
  hooks:
    - go mod tidy
    # Build the playground web UI so the Go binary embeds the real UI via
    # //go:embed all:playground/dist (otherwise it embeds only the placeholder).
    # Needs deno on the runner (jsr deps + `deno check`; Vite itself runs on
    # the Deno runtime via @deno/vite-plugin, so no node is required).
    # Wrapped in sh -c because goreleaser exec's hooks without a shell (cd is
    # a shell builtin, so "cd playground && ..." fails with "cd not found").
    # --frozen: build the release UI from exactly the dep set deno.lock pins,
    # the same one the freshness gate above verified the committed dist against.
    - sh -c "cd playground && deno install --frozen"
    - sh -c "cd playground && deno task build"

builds:
  - id: qumo
    main: .
    binary: qumo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/qumo-dev/qumo/internal/version.version={{.Version}}
      - -X github.com/qumo-dev/qumo/internal/version.commit={{.ShortCommit}}
      - -X github.com/qumo-dev/qumo/internal/version.date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: qumo-dev
    name: qumo
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"
