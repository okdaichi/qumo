# Simple Docker Compose - Complete Demo Environment
# Usage: docker compose -f docker/docker-compose.simple.yml up

services:
  # Relay Server - Tokyo
  relay-tokyo:
    image: ghcr.io/okdaichi/qumo:latest
    container_name: qumo-relay-tokyo
    command: ["relay"]
    ports:
      - "4433:4433/udp"
      - "8080:4433"
    environment:
      - RELAY_ADDR=0.0.0.0:4433
      - ADVERTISE_ADDR=relay-tokyo:4433
      - INSECURE=true
      - RELAY_NAME=relay-tokyo
      - REGION=asia
      - PEERS=moqt://relay-london:4433
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4433/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - qumo-net

  # Relay Server - London
  relay-london:
    image: ghcr.io/okdaichi/qumo:latest
    container_name: qumo-relay-london
    command: ["relay"]
    ports:
      - "4434:4433/udp"
      - "8081:4433"
    environment:
      - RELAY_ADDR=0.0.0.0:4433
      - ADVERTISE_ADDR=relay-london:4433
      - INSECURE=true
      - RELAY_NAME=relay-london
      - REGION=europe
      - PEERS=moqt://relay-tokyo:4433,moqt://relay-newyork:4433
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4433/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - qumo-net

  # Relay Server - New York
  relay-newyork:
    image: ghcr.io/okdaichi/qumo:latest
    container_name: qumo-relay-newyork
    command: ["relay"]
    ports:
      - "4435:4433/udp"
      - "8082:4433"
    environment:
      - RELAY_ADDR=0.0.0.0:4433
      - ADVERTISE_ADDR=relay-newyork:4433
      - INSECURE=true
      - RELAY_NAME=relay-newyork
      - REGION=americas
      - PEERS=moqt://relay-london:4433
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4433/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - qumo-net

networks:
  qumo-net:
    driver: bridge

# How it works:
# 1. Start everything:
#    docker compose -f docker/docker-compose.simple.yml up
# 2. Check relay health:
#    curl http://localhost:8080/health
# 3. View logs:
#    docker compose -f docker/docker-compose.simple.yml logs -f
# 4. Stop demo:
#    docker compose -f docker/docker-compose.simple.yml down
