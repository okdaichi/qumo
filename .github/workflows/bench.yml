name: Remote Benchmark

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    if: github.event.label.name == 'performance-check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Get changed packages
        id: changed_packages
        uses: tj-actions/changed-files@v44
        with:
          dir_names: true
          files_ignore: |
            .github/**
            docs/**
            **/*.md

      - name: Run base benchmark
        if: steps.changed_packages.outputs.any_changed == 'true'
        run: |
          for pkg in ${{ steps.changed_packages.outputs.all_changed_files }}; do
            # Check if directory contains go files
            if ls "$pkg"/*.go >/dev/null 2>&1; then
              echo "Benchmarking base: $pkg"
              go test -bench . -benchmem -run=^$ "./$pkg" >> base.txt || true
            fi
          done

      - name: Checkout PR branch
        if: steps.changed_packages.outputs.any_changed == 'true'
        uses: actions/checkout@v6
        with:
          clean: false

      - name: Run PR benchmark
        if: steps.changed_packages.outputs.any_changed == 'true'
        run: |
          for pkg in ${{ steps.changed_packages.outputs.all_changed_files }}; do
             if ls "$pkg"/*.go >/dev/null 2>&1; then
              echo "Benchmarking PR: $pkg"
              go test -bench . -benchmem -run=^$ "./$pkg" >> pr.txt || true
            fi
          done

      - name: Install benchstat
        if: steps.changed_packages.outputs.any_changed == 'true'
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Compare results
        if: steps.changed_packages.outputs.any_changed == 'true'
        id: compare
        run: |
          if [ -s base.txt ] && [ -s pr.txt ]; then
            echo "### Benchmark Results" > report.md
            echo "\`\`\`text" >> report.md
            benchstat base.txt pr.txt >> report.md
            echo "\`\`\`" >> report.md
          else
            echo "No benchmarks found in changed packages." > report.md
          fi

      - name: Post comment
        if: steps.changed_packages.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file report.md
