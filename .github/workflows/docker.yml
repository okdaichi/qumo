name: Docker Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - '*.go'
      - 'internal/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - '*.go'
      - 'internal/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: qumo:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Scan image for vulnerabilities
        # SHA: aquasecurity/trivy-action@0.35.0 (commit 57a97c7).
        # Pinned by SHA, not tag: trivy-action tags were force-pushed in the
        # March 2026 supply-chain attack (CVE-2026-26189 / GHSA-69fq-xp46-6x23).
        # dependabot (github-actions ecosystem) keeps this SHA current.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: qumo:ci-test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
