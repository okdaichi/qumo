name: Docker Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - '*.go'
      - 'internal/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - '*.go'
      - 'internal/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: qumo:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=min
