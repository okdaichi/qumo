name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      # Deno is required by the goreleaser `before` hooks to build the playground
      # web UI (jsr deps + `deno check`). Node (for Vite) is preinstalled on the
      # ubuntu runner. Pinned to match docker/Dockerfile's DENO_VERSION.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1

      # The release binary gets a fresh UI from the goreleaser before-hooks,
      # but `go install` embeds whatever dist is COMMITTED at this tag (module
      # zips contain only git-tracked files, #376). Fail fast before publishing
      # if the committed dist doesn't match a fresh build, so both install
      # paths ship the same UI.
      - name: Verify committed playground/dist is fresh
        run: |
          cd playground
          deno install
          deno task build
          cd ..
          if ! git diff --exit-code -- playground/dist; then
            echo "::error::committed playground/dist does not match a fresh build — rebuild and commit it before tagging (go install embeds the committed dist, see #376)"
            exit 1
          fi
          if [ -n "$(git status --porcelain playground/dist)" ]; then
            git status --porcelain playground/dist
            echo "::error::playground/dist has uncommitted build output — commit the rebuilt dist before tagging (see #376)"
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
