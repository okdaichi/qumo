name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # In-process integration tests (build tag `integration`) stand up real QUIC
      # relays, so they are kept out of the default unit run. No -race here: the
      # real-QUIC stack has not been validated under the race detector yet —
      # revisit enabling it once confirmed clean.
      - name: Run integration tests
        run: go test -tags=integration -count=1 -timeout 5m ./internal/relay/...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v -o bin/qumo .

      - name: Check binary
        run: ./bin/qumo version

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Run security scan (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m --out-format=sarif:results.sarif
        continue-on-error: true

      - name: Ensure SARIF file exists
        if: always()
        run: |
          if [ ! -f results.sarif ]; then
            # "$schema" is a literal JSON key, not a shell variable — the
            # single-quoted echo is correct and SC2016 is a false positive here.
            # shellcheck disable=SC2016
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"golangci-lint","rules":[]}},"results":[]}]}' > results.sarif
          fi

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        # Scans the module graph for known Go vulnerabilities (golang.org/x/vuln).
        # Fails the check when a dependency carries an unfixed CVE affecting
        # this code. Complements the nightly.yml scheduled run, which catches
        # CVEs disclosed after a dependency was already merged.
        # govulncheck is pinned to an explicit version (not @latest) to avoid a
        # mutable-ref supply-chain risk; the vuln DB is still fetched live per run.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          govulncheck ./...

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # SHA: actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Install actionlint
        # Pinned to an explicit version (not @latest) to avoid a mutable-ref
        # supply-chain risk — same rationale as the govulncheck/benchstat pins.
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        # Lints every .github/workflows/*.yml: catches dangling matrix/secrets/
        # env/needs refs, invalid job dependencies, malformed expressions, etc.
        # Run with no args so actionlint auto-discovers all workflow files.
        run: actionlint
