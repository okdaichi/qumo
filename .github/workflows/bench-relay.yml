name: Relay Bench (nightly + on-demand)

# Comprehensive relay-chain benchmark run: full fan-out scalability sweep
# (K=1..128), load × fan-out, object-size × fan-out, series per-hop latency,
# the reconnect-storm leak gate, and a long soak. Emits JSONL, generates
# CSV + SVG plots, uploads as an artifact.
#
# Triggers:
#   - schedule: nightly, 3h soak.
#   - workflow_dispatch: soak-duration choice (30m / 1h / 3h / 6h) — dispatch with
#     6h when a release-grade soak is wanted (no separate release workflow).
#
# Order is soak-first: the soak is the highest-value, time-bounded signal, so it
# runs before the heavy K=128 sweep (which may OOM on a 2-core runner). The
# report + upload steps are `if: always()` so partial results are still produced
# when a later heavy step fails.

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      soak_duration:
        description: "Soak duration"
        type: choice
        default: '3h'
        options:
          - '30m'
          - '1h'
          - '3h'
          - '6h'

permissions:
  contents: read

concurrency:
  group: bench-relay-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 420 # >= 6h soak + full-sweep headroom
    env:
      BENCH_RESULTS_DIR: results
      # FANOUT_KS unset → full sweep (1,2,4,8,16,32,64,128). K=128 spins 129
      # in-process QUIC relays; on a 2-core runner this is the heaviest config
      # and may be slow — that is the point (locate the knee).
      SOAK_DURATION: ${{ github.event.inputs.soak_duration || '3h' }}
    steps:
      - name: Checkout
        # SHA: actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        # SHA: actions/setup-go@v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      # Soak first: highest-value, bounded by SOAK_DURATION. A flat, generous
      # -timeout covers the longest soak (6h) + drain margin; go test returns as
      # soon as the (shorter) test finishes, so it never idles the full window.
      - name: Long soak (${{ env.SOAK_DURATION }})
        run: |
          go test -tags=integration -run='TestRelayChain_Soak' \
            -timeout 400m ./internal/relay/ -v

      - name: Reconnect storm (leak gate)
        run: |
          go test -tags=integration -run='TestRelayChain_ReconnectStorm' \
            -timeout 10m ./internal/relay/ -v

      - name: Series per-hop latency
        run: |
          go test -tags=integration -run='^$' \
            -bench='BenchmarkRelayChain_Series$' \
            -benchtime=1x -cpu=1 -timeout 30m ./internal/relay/

      - name: Fan-out scalability sweep (K=1..128)
        run: |
          go test -tags=integration -run='^$' \
            -bench='BenchmarkRelayChain_FanoutSweep$' \
            -benchtime=1x -cpu=1 -timeout 60m ./internal/relay/

      - name: Fan-out × load
        run: |
          go test -tags=integration -run='^$' \
            -bench='BenchmarkRelayChain_FanoutSweep_Load$' \
            -benchtime=1x -cpu=1 -timeout 60m ./internal/relay/

      - name: Fan-out × object size
        run: |
          go test -tags=integration -run='^$' \
            -bench='BenchmarkRelayChain_FanoutSweep_ObjSize$' \
            -benchtime=1x -cpu=1 -timeout 60m ./internal/relay/

      - name: Set up Deno
        if: always()
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.1"

      - name: Generate CSV + plots
        if: always()
        run: deno run --allow-read=results --allow-write=results scripts/relay_bench_report.ts results

      - name: Upload results
        if: always()
        # SHA: actions/upload-artifact@v6
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-bench-${{ github.event.inputs.soak_duration || 'nightly' }}
          path: |
            results/
          if-no-files-found: warn
