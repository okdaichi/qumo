# Configuration for qumo RTMP ingest server
#
# This runs a standalone RTMP→MoQT origin: publishers push RTMP,
# subscribers connect via MoQT (QUIC / WebTransport).

server:
  # MoQT/QUIC listen address for subscribers
  serve_address: "0.0.0.0:4433"

  # TLS certificate files (required for QUIC/WebTransport)
  cert_file: "certs/server.crt"
  key_file: "certs/server.key"

ingest:
  # RTMP listen address for publishers (e.g. OBS)
  ingest_address: ":1935"
