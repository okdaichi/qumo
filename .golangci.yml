version: "2"

linters:
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        - G115 # integer overflow conversion: false positive for protocol byte encoding
  exclusions:
    rules:
      - linters: [gosec]
        text: "G115"
      # Idiomatic Go: deferred Close/CloseWithError errors are not actionable
      - linters: [errcheck]
        source: "^\\s+defer "
      # Test helpers: Write errors are asserted elsewhere or irrelevant to test intent
      - linters: [errcheck]
        path: "_test\\.go"
        text: "Error return value"
      # False positive: config file path comes from a CLI flag, not external user input
      - linters: [gosec]
        path: "internal/cli/"
        text: "G304"
      # False positive: cert file paths come from a user-configured dir (CLI flag /
      # QUMO_PLAYGROUND_CERT_DIR env / per-user cache), not external user input.
      - linters: [gosec]
        path: "internal/playground/"
        text: "G304"
      # False positive: slice bounds are guaranteed by the RTMP/QUIC encoding protocol logic
      - linters: [gosec]
        text: "G602"
      # False positive: exec.Command in test re-executes the test binary itself
      - linters: [gosec]
        path: "_test\\.go"
        text: "G204"
      # False positive: ffpub intentionally launches ffmpeg with args built from
      # a validated, internally-sourced Config to drive interop tests — not external input.
      - linters: [gosec]
        path: "internal/ffpub/"
        text: "G204"
      # Log values are passed through sanitizeLog (strips CR/LF) before logging.
      # gosec taint analysis does not recognise custom sanitisers, so this is a false positive.
      - linters: [gosec]
        path: "internal/.*\\.go"
        text: "G706"
      # InsecureSkipVerify is intentional: smoke-test uses self-signed certs in Docker topology;
      # cli/relay.go sets it only on the dialer when INSECURE env var is explicitly set.
      - linters: [gosec]
        path: "internal/.*\\.go"
        text: "G402"
      # Test helpers: unhandled errors in test HTTP handlers are not actionable.
      - linters: [gosec]
        path: "_test\\.go"
        text: "G104"
      # False positive: cancel is stored in the relayHandler struct (h.cancel) and called
      # later via Drain or context.AfterFunc; gosec cannot trace cross-function ownership.
      - linters: [gosec]
        text: "G118"
